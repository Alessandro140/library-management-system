# H2 in-memory for tests (Postgres compatibility mode)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# let Hibernate create schema for tests
spring.jpa.hibernate.ddl-auto=create-drop

# Dialect for H2 during tests
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# disable Liquibase during tests
spring.liquibase.enabled=false

# show SQL for debugging if needed
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# reduce other log spam (keep Hibernate SQL logs above if needed)
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
